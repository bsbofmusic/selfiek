name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --workspace
      - run: npm run build --workspace selfiek
      - run: node packages/selfiek/dist/cli.js --version
      - run: npm pack --workspace selfiek --dry-run
