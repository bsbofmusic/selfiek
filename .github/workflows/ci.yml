name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SELFIEK_DICE_CONFIG: /tmp/selfiek-ci/dice_config.json
      SELFIEK_K_ORIGINAL: /tmp/selfiek-ci/K-original
      SELFIEK_NEW_DIR: /tmp/selfiek-ci/new
      SELFIEK_USED_DIR: /tmp/selfiek-ci/used
      SELFIEK_INSTANT_DIR: /tmp/selfiek-ci/instant
      SELFIEK_PROMPT_LIB: /tmp/selfiek-ci/prompt-lib
      SELFIEK_RUNTIME_DIR: /tmp/selfiek-ci/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add clippy rustfmt
      - run: npm ci
      - run: node packages/selfiek/scripts/create-ci-fixture.mjs /tmp/selfiek-ci
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: npm run build --workspace selfiek
      - run: node packages/selfiek/dist/cli.js --version
      - run: node packages/selfiek/dist/cli.js library lint --json
      - run: node packages/selfiek/dist/cli.js compile --json
      - run: node packages/selfiek/dist/cli.js generate --json --dry-run --use-templates
      - run: npm pack --workspace selfiek --dry-run
